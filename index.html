<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassDojo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #fff; width: 100vw; min-height: 100vh; }
    .screen {
      display: none;
      width: 100%;
      cursor: pointer;
    }
    .screen.active { display: block; }
    .screen img {
      width: 100%;
      display: block;
    }
    #screen3 {
      position: relative;
      background: #000;
      height: 100vh;
    }
    #screen3 video {
      width: 100%;
      height: 100%;
    }
    #screen3.active { display: flex; align-items: center; justify-content: center; }
    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.25);
      color: #fff;
      border: none;
      border-radius: 50%;
      font-size: 22px;
      cursor: pointer;
      z-index: 10;
      line-height: 40px;
      text-align: center;
    }
    .close-btn:hover { background: rgba(255,255,255,0.4); }
  </style>
</head>
<body>

  <div id="screen1" class="screen active" onclick="goToScreen2()">
    <img src="screen-01.png" alt="ClassDojo Home">
  </div>

  <div id="screen2" class="screen" onclick="goToScreen3()">
    <img src="screen-02.png" alt="ClassDojo Colegio">
  </div>

  <div id="screen3" class="screen">
    <button class="close-btn" onclick="closeVideo()">&times;</button>
    <video id="video" src="video.mp4" controls></video>
  </div>

  <script>
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function goToScreen2() {
      showScreen('screen2');
      document.documentElement.requestFullscreen().catch(() => {});
    }

    function goToScreen3() {
      showScreen('screen3');
      const video = document.getElementById('video');
      video.play().catch(() => {});
    }

    function closeVideo() {
      const video = document.getElementById('video');
      video.pause();
      video.currentTime = 0;
      showScreen('screen2');
    }
  </script>

</body>
</html>
